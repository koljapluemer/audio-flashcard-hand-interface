<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Italian Sentences</title>
    <script src="cordova.js"></script>
    <style>
      body { font-family: sans-serif; padding: 2em; }
      #output { font-size: 1.2em; color: darkblue; margin-top: 1em; }
      #currentSentence { font-size: 1.5em; margin: 1em 0; padding: 1em; background: #f0f0f0; }
      #currentWord { font-size: 1.2em; margin: 1em 0; padding: 1em; background: #e8f4f8; }
      #logArea { 
        height: 200px; 
        overflow-y: auto; 
        background: #f8f8f8; 
        padding: 1em; 
        margin-top: 1em;
        border: 1px solid #ddd;
        font-family: monospace;
      }
      #stats {
        margin-top: 1em;
        padding: 1em;
        background: #f0f0f0;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Italian Sentences</h1>
    <button onclick="scanAndConnect()">Scan & Connect</button>
    <button onclick="downloadButtonLogs()">Download Button Logs</button>
    <div id="currentSentence">No sentence selected</div>
    <div id="currentWord">&nbsp;</div>
    <div id="output">No data yet.</div>
    <div id="stats">No learning stats yet</div>
    <div id="logArea"></div>

    <script>
      const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
      const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
      const DATA_DIR = 'learning_data/it';  // built by build_italian_data.py
      const DEBOUNCE_TIME = 100;

      // Button 1 / Button 2 meaning per state:
      //   PLAYING_IT / IT_DONE : 1 = repeat Italian, 2 = play English
      //   WAITING_RATING       : 1 = got it,         2 = didn't get it
      //   PLAYING_FEEDBACK     : ignored
      const State = {
        IDLE: 'IDLE',
        PLAYING_IT: 'PLAYING_IT',
        IT_DONE: 'IT_DONE',
        WAITING_RATING: 'WAITING_RATING',  // English playing or finished
        PLAYING_FEEDBACK: 'PLAYING_FEEDBACK'
      };

      let sentences = null;     // [{id, it, en}]
      let current = null;       // the sentence being practised
      let currentState = State.IDLE;
      let currentAudio = null;
      let lastPlayTime = 0;
      let isProcessingButton = false;
      let audioCtx = null;
      let failedPlays = 0;      // consecutive playback failures

      // Learning data storage
      const STORAGE_KEY = 'learned_sentences';
      const BUTTON_LOGS_KEY = 'button_press_logs';
      let learnedSentences = [];
      let buttonPressLogs = [];

      function loadButtonLogs() {
        const stored = localStorage.getItem(BUTTON_LOGS_KEY);
        if (stored) buttonPressLogs = JSON.parse(stored);
      }

      function saveButtonLogs() {
        localStorage.setItem(BUTTON_LOGS_KEY, JSON.stringify(buttonPressLogs));
      }

      function logButtonPress(context) {
        buttonPressLogs.push({ timestamp: new Date().toISOString(), context: context });
        saveButtonLogs();
      }

      // Download button press logs as JSON
      function downloadButtonLogs() {
        addLog('Preparing to share button logs...');
        const dataStr = JSON.stringify(buttonPressLogs, null, 2);
        const fileName = `button_press_logs_${new Date().toISOString().split('T')[0]}.json`;

        if (window.cordova && window.plugins && window.plugins.socialsharing) {
          window.plugins.socialsharing.share(
            dataStr, fileName, null, null,
            () => addLog('Logs shared successfully'),
            error => {
              addLog('Error sharing logs: ' + JSON.stringify(error));
              alert('Failed to share logs: ' + JSON.stringify(error));
            }
          );
        } else {
          const blob = new Blob([dataStr], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      }

      function loadLearningData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) learnedSentences = JSON.parse(stored);
        updateStatsDisplay();
      }

      function saveLearningData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(learnedSentences));
      }

      function recordLearnedSentence(sentenceKey) {
        learnedSentences.push({ sentenceKey: sentenceKey, timestamp: new Date().toISOString() });
        saveLearningData();
        updateStatsDisplay();
      }

      function updateStatsDisplay() {
        const today = new Date().toISOString().split('T')[0];
        const learnedToday = learnedSentences.filter(s => s.timestamp.startsWith(today)).length;
        const last = learnedSentences[learnedSentences.length - 1];
        document.getElementById('stats').innerHTML = `
          <h3>Learning Statistics</h3>
          <p>Total sentences learned: ${learnedSentences.length}</p>
          <p>Sentences learned today: ${learnedToday}</p>
          <p>Last learned: ${last ? new Date(last.timestamp).toLocaleString() : 'Never'}</p>
        `;
      }

      fetch(`${DATA_DIR}/sentences.json`)
        .then(response => response.json())
        .then(data => {
          sentences = data;
          addLog(`Loaded ${sentences.length} Italian sentences`);
          loadLearningData();
          loadButtonLogs();
        })
        .catch(error => addLog('Error loading sentences: ' + error));

      function addLog(text) {
        const logArea = document.getElementById('logArea');
        const logEntry = document.createElement('div');
        logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        logArea.insertBefore(logEntry, logArea.firstChild);
        while (logArea.children.length > 50) logArea.removeChild(logArea.lastChild);
      }

      function log(text) {
        document.getElementById('output').innerText = text;
        addLog(text);
        console.log(text);
      }

      function selectNewRandomSentence() {
        if (!sentences || sentences.length === 0) {
          log('Sentences not loaded yet');
          return;
        }
        let next;
        do {
          next = sentences[Math.floor(Math.random() * sentences.length)];
        } while (sentences.length > 1 && current && next.id === current.id);
        current = next;

        document.getElementById('currentSentence').innerText = current.it;
        document.getElementById('currentWord').innerHTML = '&nbsp;';
        log('Selected sentence ' + current.id);
        playItalian();
      }

      // Short sine tones instead of feedback audio files: rising = right,
      // low = wrong. Calls onDone when finished.
      function playFeedbackTone(isCorrect, onDone) {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const notes = isCorrect ? [660, 880] : [220];
          const len = isCorrect ? 0.12 : 0.3;
          const t0 = audioCtx.currentTime;
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.25, t0 + i * len);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + (i + 1) * len);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0 + i * len);
            osc.stop(t0 + (i + 1) * len);
          });
          setTimeout(onDone, notes.length * len * 1000 + 150);
        } catch (e) {
          addLog('Feedback tone failed: ' + e.message);
          onDone();
        }
      }

      // onEnded runs when the clip finishes naturally (not when interrupted).
      function playAudio(path, onEnded) {
        if (currentAudio) {
          currentAudio.onended = null;
          currentAudio.pause();
        }
        log('Playing: ' + path);
        const audio = new Audio(path);
        currentAudio = audio;
        audio.onended = () => {
          if (currentAudio === audio) onEnded();
        };
        audio.play()
          .then(() => { lastPlayTime = Date.now(); failedPlays = 0; })
          .catch(error => {
            if (currentAudio !== audio) return;  // superseded, not a failure
            addLog('Error playing ' + path + ' - ' + error.message);
            if (++failedPlays >= 3) {
              log('Audio keeps failing; press a button to retry');
              currentState = State.IDLE;
              failedPlays = 0;
              return;
            }
            selectNewRandomSentence();
          });
      }

      function playItalian() {
        currentState = State.PLAYING_IT;
        playAudio(`${DATA_DIR}/audio/${current.id}_it.mp3`, () => {
          currentState = State.IT_DONE;
        });
      }

      function playEnglish() {
        document.getElementById('currentWord').innerText = current.en;
        currentState = State.WAITING_RATING;
        playAudio(`${DATA_DIR}/audio/${current.id}_en.mp3`, () => {});
      }

      function handleRating(isCorrect) {
        if (currentAudio) {
          currentAudio.onended = null;
          currentAudio.pause();
        }
        logButtonPress(`Sentence ${current.id} rated as ${isCorrect ? 'correct' : 'incorrect'}`);
        if (isCorrect) recordLearnedSentence(current.id);
        currentState = State.PLAYING_FEEDBACK;
        playFeedbackTone(isCorrect, selectNewRandomSentence);
      }

      function handleButtonPress(message) {
        if (message !== 'Button 1 Pressed' && message !== 'Button 2 Pressed') return;
        const isButton1 = message === 'Button 1 Pressed';
        addLog(`${message}, state: ${currentState}`);

        if (isProcessingButton) {
          addLog('Ignoring button press - still processing previous press');
          return;
        }
        if (Date.now() - lastPlayTime < DEBOUNCE_TIME) {
          addLog('Ignoring button press - too soon since last play');
          return;
        }
        isProcessingButton = true;
        setTimeout(() => { isProcessingButton = false; }, DEBOUNCE_TIME);

        switch (currentState) {
          case State.PLAYING_IT:
          case State.IT_DONE:
            if (isButton1) {
              logButtonPress(`Sentence ${current.id} repeated in Italian`);
              playItalian();
            } else {
              logButtonPress(`Sentence ${current.id} played in English`);
              playEnglish();
            }
            break;
          case State.WAITING_RATING:
            handleRating(isButton1);
            break;
          case State.IDLE:
            selectNewRandomSentence();
            break;
          // PLAYING_FEEDBACK: ignore
        }
      }

      function scanAndConnect() {
        log("Scanning for BLE device...");
        ble.scan([SERVICE_UUID], 5, device => {
          log("Found: " + device.name + " - " + device.id);
          ble.connect(device.id, onConnect, onError);
        }, onError);
      }

      function onConnect(peripheral) {
        log("Connected to " + peripheral.id);

        ble.startNotification(
          peripheral.id,
          SERVICE_UUID,
          CHARACTERISTIC_UUID,
          buffer => {
            const message = new TextDecoder().decode(buffer);
            handleButtonPress(message);
          },
          onError
        );

        // Start playing only after BLE is connected
        selectNewRandomSentence();
      }

      function onError(error) {
        log("Error: " + JSON.stringify(error));
      }
    </script>
  </body>
</html>
